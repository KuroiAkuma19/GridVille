<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GridVille</title>
  <link rel="stylesheet" href="/main.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script type="module" src="./scripts/game.js"></script>
  <script type="module" src="./scripts/ui.js"></script>
</head>

<body>
  <div id="start-screen" class="text-overlay" style="z-index: 100; flex-direction: column; background: rgba(0, 0, 0, 0.8);">
    <h1 style="font-size: 1em; margin-bottom: 20px; font-weight: normal;">Welcome to GridVille</h1>
    <input type="text" id="player-name-input" placeholder="Enter Mayor Name" value="Mayor" style="font-size: 0.3em; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; text-align: center; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
    <input type="text" id="city-name-input" placeholder="Enter City Name" value="My City" style="font-size: 0.3em; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: none; text-align: center; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
    <button id="start-game-button" class="ui-button" style="width: auto; padding: 10px 20px; font-size: 0.3em; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; cursor: pointer; color: white; margin-bottom: 10px;">START NEW GAME</button>
    <div style="display: flex; gap: 10px;">
      <button id="load-game-button" class="ui-button" style="width: auto; padding: 10px 20px; font-size: 0.3em; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; cursor: pointer; color: white;" onclick="window.ui.loadCity(true)">LOAD SAVE</button>
      <button id="import-game-button" class="ui-button" style="width: auto; padding: 10px 20px; font-size: 0.3em; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; cursor: pointer; color: white;" onclick="document.getElementById('import-file-input').click()">IMPORT SAVE</button>
      <input type="file" id="import-file-input" style="display: none;" accept=".json" onchange="window.ui.importSave(event)">
    </div>
  </div>
  <div id="root-window">
    <!-- Three.js adds a `canvas` element to this element-->
    <div id="render-target"></div>
    <div id="loading" class="text-overlay">
      <div>
        LOADING...
      </div>
    </div>
    <div id="xp-toast" style="position: absolute; top: 80px; left: 50%; transform: translateX(-50%); color: #ffdf00; font-family: 'Bebas-Regular', sans-serif; font-size: 2em; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; opacity: 0; transition: all 0.5s ease-out; z-index: 50;">
      +50 XP
    </div>
    <div id="paused-text" class="text-overlay" style="visibility: hidden;">
      <div>
        PAUSED
      </div>
    </div>
    <div id="ui">
      <div id="title-bar">
        <div class="title-bar-left-items title-bar-items">
          $<span id="money-counter">10000</span>
          <span style="margin-left: 15px;" title="Happiness Index">😊 <span id="happiness-counter">50</span>%</span>
        </div>
        <div class="title-bar-center-items title-bar-items" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 300px; text-shadow: 1px 1px 2px #000;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span id="player-badge" style="background: rgba(255, 255, 255, 0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.75em; font-weight: normal;">
              <span id="player-name">Mayor</span><span id="player-tag" style="color: #aaa;">#0000</span>
            </span>
            <span style="color: #ccc; font-weight: normal;">|</span>
            <span id="city-name" style="font-size: 0.9em; font-weight: normal;">My City</span>
            <span style="color: #ccc; font-weight: normal;">|</span>
            <span id="sim-time" style="color: #ccc; font-size: 0.9em;">1/1/2023</span>
          </div>
          <div style="display: flex; align-items: center; gap: 5px; margin-top: 4px; width: 100%; font-weight: normal;">
            <span style="font-size: 0.7em; color: #ffcc00; font-weight: normal;">LVL <span id="player-level">1</span></span>
            <div style="flex-grow: 1; background: #333; height: 6px; border-radius: 3px; overflow: hidden; position: relative; border: 1px solid #555;">
               <div id="xp-bar-fill" style="position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: linear-gradient(90deg, #d4af37, #ffdf00); transition: width 0.3s ease-out;"></div>
            </div>
            <span style="font-size: 0.6em; color: #aaa; width: 60px; text-align: right; white-space: nowrap;"><span id="xp-current">0</span> / <span id="xp-needed">100</span></span>
          </div>
        </div>
        <div class="title-bar-right-items title-bar-items">
          <img id="population-icon" src="/icons/person.png">
          <span id="population-counter">0</span>
        </div>
      </div>
      <div id="ui-toolbar" class="container">
        <button id='button-select' class="ui-button selected" data-type="select" data-tooltip="Select"
          onclick="ui.onToolSelected(event)">
          <img class="toolbar-icon" src="/icons/select-color.png">
        </button>
        <button id='button-bulldoze' class="ui-button" data-type="bulldoze" data-tooltip="Bulldoze" title="Bulldozer Tool"
          onclick="ui.onToolSelected(event)">
          <img class="toolbar-icon" src="/icons/bulldozer-color.png">
        </button>
        <button id='button-residential' class="ui-button" data-type="residential" data-tooltip="Residential" title="Residential Zones"
          onclick="ui.onToolSelected(event)">
          <img class="toolbar-icon" src="/icons/house-color.png">
        </button>
        <button id='button-commercial' class="ui-button" data-type="commercial" data-tooltip="Commercial" title="Commercial Zones"
          onclick="ui.onToolSelected(event)">
          <img class="toolbar-icon" src="/icons/store-color.png">
        </button>
        <button id='button-industrial' class="ui-button" data-type="industrial" data-tooltip="Industrial" title="Industrial Zones"
          onclick="ui.onToolSelected(event)">
          <img class="toolbar-icon" src="/icons/factory-color.png">
        </button>
        <button id='button-road' class="ui-button" data-type="road" data-tooltip="Road" title="Road Building Tool"
          onclick="ui.onToolSelected(event)">
          <img class="toolbar-icon" src="/icons/road-color.png">
        </button>
        <button id='button-power-plant' class="ui-button" data-type="power-plant" data-tooltip="Power Plant" title="Build Power Plant"
          onclick="ui.onToolSelected(event)">
          <img class="toolbar-icon" src="/icons/power-color.png">
        </button>
        <button id='button-power-line' class="ui-button" data-type="power-line" data-tooltip="Power Line" title="Build Power Lines"
        onclick="ui.onToolSelected(event)">
        <img class="toolbar-icon" src="/icons/power-line-color.png">
      </button>
        <button id='button-pause' class="ui-button" onclick="ui.togglePause()" data-tooltip="Pause/Play">
          <img id='pause-button-icon' class="toolbar-icon" src="/icons/pause-color.png">
        </button>
        <button id='button-expand' class="ui-button" onclick="window.game.city.expand()" data-tooltip="Expand City ($15,000)">
          <span style="font-size: 24px; color: white;">🗺️</span>
        </button>
        <button id='button-save' class="ui-button" onclick="window.ui.saveCity()" data-tooltip="Save City">
          <span style="font-size: 24px; color: white;">💾</span>
        </button>
        <button id='button-export' class="ui-button" onclick="window.ui.exportSave()" data-tooltip="Export Save File">
          <span style="font-size: 24px; color: white;">⬇️</span>
        </button>
        <button id='button-tasks' class="ui-button" onclick="window.ui.toggleTasksPanel()" data-tooltip="Mayor Tasks">
          <span style="font-size: 24px; color: white;">📋</span>
        </button>
        <button id='button-load' class="ui-button" onclick="window.ui.loadCity()" data-tooltip="Load City">
          <span style="font-size: 24px; color: white;">📂</span>
        </button>
      </div>

      <div id="catalog-panel" class="container" style="display: none; position: absolute; left: 80px; top: 10px; max-height: 80vh; overflow-y: auto; background-color: rgba(30, 41, 59, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #4a5568; z-index: 10;">
        <h2 id="catalog-title" style="margin-top: 0; color: #fff; border-bottom: 1px solid #4a5568; padding-bottom: 5px;">Catalog</h2>
        <div id="catalog-items" style="display: flex; flex-wrap: wrap; gap: 10px; width: 300px;">
          <!-- Items will be populated here -->
        </div>
      </div>
      
      <div id="tasks-panel" class="container" style="display: none; position: absolute; left: 80px; top: 10px; max-height: 80vh; overflow-y: auto; background-color: rgba(30, 41, 59, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #4a5568; z-index: 10; width: 300px;">
        <h2 style="margin-top: 0; color: #fff; border-bottom: 1px solid #4a5568; padding-bottom: 5px;">Mayor Tasks</h2>
        <div id="tasks-list" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Tasks will be populated here -->
        </div>
      </div>

      <div id="info-panel" class="container">
      </div>
      <div id="instructions" style="background-color: rgba(0, 0, 0, 0.6); padding: 8px 12px; border-radius: 8px; left: 70px; border: 1px solid #4a5568;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; border-bottom: 1px solid #555; padding-bottom: 4px;">
          <span style="font-weight: bold; color: #ccc; font-size: 0.8em;">CONTROLS</span>
          <span onclick="document.getElementById('instructions').style.display='none'" style="cursor: pointer; color: #aaa; font-family: sans-serif; font-size: 1em; padding-left: 15px;" title="Dismiss">✖</span>
        </div>
        <div style="font-size: 0.9em;">
          INTERACT - Left Mouse<br>
          ROTATE - Right Mouse<br>
          PAN - Control + Right Mouse<br>
          ZOOM - Scroll
        </div>
      </div>
      <div id="version">
        v0.3.0
      </div>
    </div>
  </div>
</body>

</html>
